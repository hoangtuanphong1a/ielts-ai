# Hạ tầng dev: PostgreSQL + Redis. Chạy: docker compose up -d
# Cổng lệch chuẩn (5434, 6380) để không đụng Postgres/Redis của dự án khác trên máy.
services:
  db:
    image: postgres:16-alpine
    container_name: ielts-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts_ai}
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ielts} -d ${POSTGRES_DB:-ielts_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ielts-ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"

volumes:
  pgdata:
